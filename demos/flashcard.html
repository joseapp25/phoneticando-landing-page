<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Demonstração</title>
  <link rel="stylesheet" href="../styles/style.css">
  <!--
    Demo da nova revisão de flashcards (Proposta E, phoneticando/api#239/#240).
    Cópia em HTML puro do componente real do trainer-web
    (src/components/review/FlashcardReviewV2.vue + AudioRingButton.vue):
    mudou lá, atualizar aqui. Fluxo de um card: opções travadas até o
    primeiro áudio terminar (pausar também conta) → escolher uma opção vira o
    card na hora → depois do giro: borda verde/vermelha só na escolhida,
    veredito, som e "Próxima".
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--graycool0);
    }

    body {
      --ink: var(--graycool1000);
      --ok: #43a047;
      --bad: #e53935;
      color: var(--ink);
      font-family: var(--font-dm-sans);
    }

    .review {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 0 24px;
    }

    /* ── Progresso ───────────────────────────────────────────────── */
    .progress {
      width: 314px;
      max-width: calc(100% - 32px);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .segments {
      display: flex;
      gap: 2px;
      justify-content: center;
    }

    .segments span {
      flex: 0 1 14px;
      min-width: 2px;
      height: 6px;
      border-radius: 3px;
      background: var(--cerulean200);
      transition: background-color 0.3s;
    }

    .segments span.on {
      background: var(--cerulean600);
    }

    .position {
      font-weight: 300;
      font-size: 12px;
      line-height: 24px;
    }

    /* ── Status: ouvir / veredito ────────────────────────────────── */
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 68px;
    }

    .label {
      font-weight: 700;
      font-size: 12px;
      line-height: 24px;
    }

    .verdict {
      width: 40px;
      height: 40px;
    }

    /* ── Botão de áudio com anel de progresso ────────────────────── */
    .audio-ring-button {
      position: relative;
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 50%;
      background: var(--cerulean100);
      border: 2px solid var(--cerulean200);
      color: var(--cerulean600);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s, filter 0.2s, transform 0.12s;
    }

    .audio-ring-button:hover:not([disabled]) { filter: brightness(0.96); }
    .audio-ring-button:active:not([disabled]) { transform: scale(0.95); }

    .audio-ring-button[disabled] {
      opacity: 0.32;
      cursor: default;
    }

    .audio-ring-button:focus-visible,
    button.option:focus-visible,
    .next:focus-visible,
    .restart:focus-visible {
      outline: 3px solid var(--cerulean300);
      outline-offset: 2px;
    }

    .ring {
      position: absolute;
      inset: -2px;
      width: 40px;
      height: 40px;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .ring circle {
      fill: none;
      stroke: var(--cerulean600);
      stroke-width: 2;
      stroke-dasharray: 119.38;
      stroke-dashoffset: 119.38;
    }

    .icon { position: relative; display: flex; }
    .audio-ring-button .pause { display: none; }
    .audio-ring-button.playing .pause { display: block; }
    .audio-ring-button.playing .speaker { display: none; }

    /* ── Card ────────────────────────────────────────────────────── */
    .stage {
      width: 360px;
      max-width: calc(100% - 32px);
      height: 320px;
      perspective: 1200px;
    }

    .card-inner {
      height: 100%;
      display: grid;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      grid-area: 1 / 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--graycool100);
      border-radius: 8px;
      background: #ffffff;
      box-shadow:
        0 1px 2px rgba(28, 28, 34, 0.06),
        0 12px 32px rgba(20, 61, 123, 0.12);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* backface-visibility falha em alguns navegadores: esconde também a
         face de trás na metade do giro */
      transition: visibility 0s 0.25s;
    }

    .card-inner.flipped .card-face.front,
    .card-inner:not(.flipped) .card-face.back {
      visibility: hidden;
    }

    .card-face.back { transform: rotateY(180deg); }

    .side {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 300;
      font-size: 12px;
      line-height: 24px;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
      max-width: calc(100% - 32px);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .option {
      flex: 1;
      min-width: 0;
      height: 80px;
      padding: 8px;
      border: 1px solid var(--graycool100);
      border-radius: 8px;
      background: #fafafd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      color: var(--ink);
      transition: box-shadow 0.2s, border-color 0.2s, background-color 0.2s, transform 0.12s;
    }

    button.option { cursor: pointer; }

    button.option:hover:not([disabled]) {
      border-color: var(--cerulean300);
      background: var(--cerulean50);
    }

    button.option:active:not([disabled]) { transform: scale(0.97); }
    button.option[disabled] { cursor: default; }
    .option.locked .word { opacity: 0.25; }

    /* borda real de 4px; padding compensa pro conteúdo não mexer */
    .option.chosen-correct,
    .option.chosen-wrong {
      border-width: 4px;
      padding: 5px;
    }

    .option.chosen-correct {
      border-color: var(--ok);
      box-shadow: 0 0 12px rgba(67, 160, 71, 0.5);
    }

    .option.chosen-wrong {
      border-color: var(--bad);
      box-shadow: 0 0 12px rgba(229, 57, 53, 0.5);
    }

    .word {
      font-family: var(--font-grotesk);
      font-weight: 700;
      font-size: 24px;
      line-height: 32px;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .placeholder {
      width: 100px;
      height: 24px;
      border-radius: 4px;
      background: var(--graycool50);
    }

    .ipa {
      font-family: var(--font-noto);
      font-weight: 300;
      font-size: 16px;
      line-height: 24px;
      color: var(--graycool600);
    }

    .ipa b { font-weight: 700; }
    .ipa .vl { color: var(--sunset600); }
    .ipa .vd { color: var(--cerulean600); }

    /* ── Botões de baixo ─────────────────────────────────────────── */
    .actions { height: 48px; }

    .next,
    .restart {
      width: 190px;
      height: 48px;
      border: none;
      border-radius: 4px;
      background: var(--cerulean600);
      color: #fafafd;
      font-family: var(--font-grotesk);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.12s;
    }

    .next:hover, .restart:hover { filter: brightness(0.96); }
    .next:active, .restart:active { transform: scale(0.97); }

    /* ── Fim da demo ─────────────────────────────────────────────── */
    .finished {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 64px 16px;
      text-align: center;
    }

    .finished-title {
      font-family: var(--font-grotesk);
      font-weight: 700;
      font-size: 24px;
      line-height: 32px;
    }

    .finished-subtitle {
      max-width: 320px;
      color: var(--graycool700);
      line-height: 24px;
    }

    .score {
      display: flex;
      gap: 24px;
      font-weight: 700;
    }

    .score .ok { color: var(--ok); }
    .score .bad { color: var(--bad); }

    @media (prefers-reduced-motion: reduce) {
      .card-inner, .card-face { transition: none; }
    }
  </style>
</head>
<body>
  <div class="review" id="app"></div>

  <template id="audio-button">
    <button type="button" class="audio-ring-button">
      <svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" /></svg>
      <span class="icon">
        <svg class="pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1" />
          <rect x="14" y="5" width="4" height="14" rx="1" />
        </svg>
        <svg class="speaker" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <g transform="translate(1 2.234375)">
            <path fill-rule="evenodd" d="M12 0L5.72302 3.76619L0 3.76619L0 15.7662L5.72302 15.7662L12 19.5324L12 0ZM10 3.53238L10 16L6.27698 13.7662L2 13.7662L2 5.76619L6.27698 5.76619L10 3.53238Z" />
            <path d="M17.2729 2.90287C18.9645 4.69468 20 7.10845 20 9.76626C20 12.4241 18.9645 14.8378 17.2729 16.6297L18.7271 18.0026C20.7552 15.8544 22 12.9546 22 9.76626C22 6.57792 20.7552 3.67814 18.7271 1.5299L17.2729 2.90287Z" />
            <path d="M17.0002 9.76619C17.0002 8.10981 16.4262 6.59025 15.4654 5.39166L17.0259 4.14072C18.2609 5.68133 19.0002 7.63878 19.0002 9.76619C19.0002 11.8936 18.2609 13.8511 17.0259 15.3917L15.4654 14.1407C16.4262 12.9421 17.0002 11.4226 17.0002 9.76619Z" />
            <path d="M13.2009 7.36677C13.703 8.0352 14.0001 8.86456 14.0001 9.76619C14.0001 10.6678 13.703 11.4972 13.2009 12.1656L14.8001 13.3668C15.5534 12.3639 16.0001 11.1158 16.0001 9.76619C16.0001 8.41661 15.5534 7.1685 14.8001 6.16561L13.2009 7.36677Z" />
          </g>
        </svg>
      </span>
    </button>
  </template>

  <script>
    // ── Dados ─────────────────────────────────────────────────────
    // Mesmo formato dos flashcards da api (tipo pares_minimos): palavra,
    // transcrição (sem barras; <b> no som que muda, .vl surdo, .vd vozeado)
    // e áudio de cada opção, mais qual opção o áudio principal fala.
    const MEDIA = '../midia/flashcard-demo/'
    const WORDS = {
      tree:  '<b><span class="vl">t</span></b>riː',
      three: '<b><span class="vl">θ</span></b>riː',
      head:  '<b><span class="vl">h</span></b>ed',
      red:   '<b><span class="vd">r</span></b>ed',
      pig:   '<b><span class="vl">p</span></b>ɪɡ',
      big:   '<b><span class="vd">b</span></b>ɪɡ',
      thigh: '<b><span class="vl">θ</span></b>aɪ',
      thy:   '<b><span class="vd">ð</span></b>aɪ',
      free:  '<b><span class="vl">f</span></b>riː',
      sue:   '<b><span class="vl">s</span></b>uː',
      zoo:   '<b><span class="vd">z</span></b>uː',
      ruche: 'ruː<b><span class="vl">ʃ</span></b>',
      rouge: 'ruː<b><span class="vd">ʒ</span></b>',
      chin:  '<b><span class="vl">tʃ</span></b>ɪn',
      gin:   '<b><span class="vd">dʒ</span></b>ɪn',
    }
    // [opção A, opção B, palavra que o áudio fala]
    const PAIRS = [
      ['tree', 'three', 'tree'],
      ['head', 'red', 'red'],
      ['pig', 'big', 'pig'],
      ['thigh', 'thy', 'thy'],
      ['free', 'three', 'three'],
      ['sue', 'zoo', 'sue'],
      ['ruche', 'rouge', 'rouge'],
      ['chin', 'gin', 'gin'],
      ['pig', 'big', 'big'],
      ['chin', 'gin', 'chin'],
      ['thigh', 'thy', 'thigh'],
      ['free', 'three', 'free'],
      ['ruche', 'rouge', 'ruche'],
      ['sue', 'zoo', 'zoo'],
      ['tree', 'three', 'three'],
      ['head', 'red', 'head'],
    ]
    const CARDS = PAIRS.map(([a, b, answer], id) => ({
      id,
      correctOption: answer === a ? 'A' : 'B',
      options: [
        { key: 'A', word: a, transcription: WORDS[a], audioUrl: `${MEDIA}${a}.mp3` },
        { key: 'B', word: b, transcription: WORDS[b], audioUrl: `${MEDIA}${b}.mp3` },
      ],
    }))

    const FLIP_MS = 500
    const RING = 119.38 // 2π·19: anel sobre a borda de 2px do botão de 40px

    // ── Sons de acerto/erro, pré-carregados (tocam sem atraso) ────
    const SOUND_URLS = {
      correct: '../assets-vault/midia-vault/correct-answer.mp3',
      incorrect: '../assets-vault/midia-vault/incorrect-answer.mp3',
    }
    let ctx = null
    const buffers = {}
    const fallback = {}

    async function preloadSounds() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext
      if (!AudioContextClass) {
        for (const [key, url] of Object.entries(SOUND_URLS)) {
          fallback[key] = new Audio(url)
          fallback[key].preload = 'auto'
        }
        return
      }
      ctx = new AudioContextClass()
      await Promise.all(Object.entries(SOUND_URLS).map(async ([key, url]) => {
        try {
          buffers[key] = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer())
        } catch {
          fallback[key] = new Audio(url)
        }
      }))
    }

    function playAnswerSound(correct) {
      const key = correct ? 'correct' : 'incorrect'
      try {
        if (ctx && buffers[key]) {
          if (ctx.state === 'suspended') ctx.resume()
          const source = ctx.createBufferSource()
          source.buffer = buffers[key]
          source.connect(ctx.destination)
          source.start()
          return
        }
        const el = fallback[key] || (fallback[key] = new Audio(SOUND_URLS[key]))
        el.currentTime = 0
        el.play().catch(() => {})
      } catch {
        // som é enfeite: nunca atrapalha a demo
      }
    }

    function unlockSounds() {
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {})
    }

    // Áudios das palavras: baixa o do card atual e o do próximo.
    const preloaded = new Set()
    function preloadCard(card) {
      if (!card) return
      for (const opt of card.options) {
        if (preloaded.has(opt.audioUrl)) continue
        preloaded.add(opt.audioUrl)
        const el = new Audio()
        el.preload = 'auto'
        el.src = opt.audioUrl
      }
    }

    // ── Estado ────────────────────────────────────────────────────
    let index = 0
    let heard = false
    let chosen = null
    let marked = false
    let markTimer = null
    const stats = { correct: 0, wrong: 0 }

    const app = document.getElementById('app')
    const card = () => CARDS[index]
    const isCorrect = () => chosen === card().correctOption

    // ── Áudio (um por vez; tocar de novo no mesmo botão pausa) ────
    let audio = null
    let playingKey = null
    let raf = 0

    function stopAudio() {
      if (audio) {
        audio.pause()
        audio = null
      }
    }

    function setRing(key, progress) {
      const btn = app.querySelector(`[data-audio="${key}"]`)
      if (!btn) return
      btn.classList.toggle('playing', progress !== null)
      btn.setAttribute('aria-pressed', String(progress !== null))
      btn.querySelector('circle').style.strokeDashoffset = RING * (1 - (progress || 0))
    }

    function toggleAudio(key, url) {
      unlockSounds()
      if (playingKey === key) {
        stopAudio()
        return
      }
      stopAudio()
      if (!url) return
      const el = new Audio(url)
      // o evento de pausa chega assíncrono: só destrava o card em que o áudio tocou
      const cardId = card().id
      audio = el
      playingKey = key
      setRing(key, 0)
      const tick = () => {
        if (el.duration && playingKey === key) setRing(key, el.currentTime / el.duration)
        if (audio === el) raf = requestAnimationFrame(tick)
      }
      const finish = () => {
        cancelAnimationFrame(raf)
        if (audio === el) audio = null
        if (playingKey === key) {
          setRing(key, null)
          playingKey = null
        }
        // as opções destravam quando o primeiro áudio do card termina (ou é pausado)
        if (key === 'main' && card() && card().id === cardId && !heard) {
          heard = true
          renderStatus()
          renderFront()
        }
      }
      el.addEventListener('ended', finish)
      el.addEventListener('pause', finish)
      el.addEventListener('error', finish)
      el.play().then(() => (raf = requestAnimationFrame(tick))).catch(finish)
    }

    // ── Render ────────────────────────────────────────────────────
    const tpl = document.getElementById('audio-button')

    function audioButton(key, label, { disabled = false } = {}) {
      const btn = tpl.content.firstElementChild.cloneNode(true)
      btn.setAttribute('aria-label', label)
      if (disabled) {
        btn.disabled = true
      } else {
        btn.dataset.audio = key
        btn.setAttribute('aria-pressed', 'false')
      }
      return btn
    }

    const VERDICT = {
      true: '<svg class="verdict" viewBox="0 0 1024 1024" fill="#43a047" aria-hidden="true"><path fill-rule="evenodd" d="M85.333 512.003C85.333 276.361 276.358 85.3359 512 85.3359C747.641 85.3359 938.666 276.361 938.666 512.003C938.666 747.644 747.641 938.669 512 938.669C276.358 938.669 85.333 747.644 85.333 512.003ZM426.662 743.005L828.335 341.332L767.996 280.992L426.662 622.325L255.996 451.659L195.656 511.999L426.662 743.005Z"/></svg>',
      false: '<svg class="verdict" viewBox="0 0 1024 1024" fill="#e53935" aria-hidden="true"><path fill-rule="evenodd" d="M512 85.3359C276.358 85.3359 85.333 276.361 85.333 512.003C85.333 747.644 276.358 938.669 512 938.669C747.641 938.669 938.666 747.644 938.666 512.003C938.666 276.361 747.641 85.3359 512 85.3359ZM511.996 572.342L328.829 755.509L268.489 695.169L451.656 512.003L268.496 328.842L328.835 268.503L511.996 451.663L695.156 268.503L755.496 328.842L572.335 512.003L755.502 695.169L695.162 755.509L511.996 572.342Z"/></svg>',
    }

    function render() {
      const c = card()
      if (!c) return renderFinished()
      preloadCard(c)
      preloadCard(CARDS[index + 1])
      app.innerHTML = `
        <div class="progress">
          <div class="segments" aria-hidden="true">
            ${CARDS.map((_, i) => `<span class="${i <= index ? 'on' : ''}"></span>`).join('')}
          </div>
          <span class="position">Card ${index + 1} de ${CARDS.length}</span>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="stage">
          <div class="card-inner" id="cardInner">
            <div class="card-face front" id="front">
              <span class="side">FRENTE</span>
              <div class="rows"></div>
            </div>
            <div class="card-face back" id="back" aria-hidden="true">
              <span class="side">VERSO</span>
              <div class="rows"></div>
            </div>
          </div>
        </div>
        <div class="actions" id="actions"></div>
      `
      renderStatus()
      renderFront()
      renderBack()
    }

    function renderStatus() {
      const status = document.getElementById('status')
      if (marked) {
        status.innerHTML = `${VERDICT[isCorrect()]}<span class="label">${isCorrect() ? 'CORRETO!' : 'INCORRETO!'}</span>`
        return
      }
      status.innerHTML = ''
      const c = card()
      const main = c.options.find((o) => o.key === c.correctOption)
      const btn = audioButton('main', 'Ouvir')
      btn.addEventListener('click', () => toggleAudio('main', main.audioUrl))
      const label = document.createElement('span')
      label.className = 'label'
      label.textContent = heard ? 'QUAL PALAVRA VOCÊ OUVIU?' : 'CLIQUE PARA OUVIR'
      status.append(btn, label)
      if (playingKey === 'main') setRing('main', 0)
    }

    function renderFront() {
      const rows = document.querySelector('#front .rows')
      rows.innerHTML = ''
      for (const opt of card().options) {
        const row = document.createElement('div')
        row.className = 'row'
        const option = document.createElement('button')
        option.type = 'button'
        option.className = 'option' + (heard ? '' : ' locked')
        option.disabled = !heard || chosen !== null
        option.innerHTML = `<span class="word">${opt.word}</span><span class="placeholder"></span>`
        option.addEventListener('click', () => choose(opt.key))
        row.append(audioButton(null, `Ouvir ${opt.word}`, { disabled: true }), option)
        rows.append(row)
      }
    }

    function renderBack() {
      const rows = document.querySelector('#back .rows')
      rows.innerHTML = ''
      for (const opt of card().options) {
        const row = document.createElement('div')
        row.className = 'row'
        const btn = audioButton(opt.key, `Ouvir ${opt.word}`)
        btn.addEventListener('click', () => toggleAudio(opt.key, opt.audioUrl))
        const option = document.createElement('div')
        option.className = 'option'
        if (marked && chosen === opt.key) option.classList.add(isCorrect() ? 'chosen-correct' : 'chosen-wrong')
        option.innerHTML = `<span class="word">${opt.word}</span><span class="ipa">/<span>${opt.transcription}</span>/</span>`
        row.append(btn, option)
        rows.append(row)
      }
    }

    function renderFinished() {
      app.innerHTML = `
        <div class="finished">
          <p class="finished-title">Revisão concluída!</p>
          <p class="finished-subtitle">No Phoneticando, os cards voltam no momento certo: os que você errou aparecem de novo antes.</p>
          <div class="score">
            <span class="ok">${stats.correct} ${stats.correct === 1 ? 'acerto' : 'acertos'}</span>
            <span class="bad">${stats.wrong} ${stats.wrong === 1 ? 'erro' : 'erros'}</span>
          </div>
          <button type="button" class="restart" id="restart">Recomeçar</button>
        </div>
      `
      document.getElementById('restart').addEventListener('click', restart)
    }

    // ── Ações ─────────────────────────────────────────────────────
    function choose(key) {
      if (chosen !== null) return
      stopAudio()
      chosen = key
      if (isCorrect()) stats.correct++
      else stats.wrong++
      renderFront()
      // o card vira na hora; borda, veredito, som e "Próxima" só depois do giro
      document.getElementById('cardInner').classList.add('flipped')
      document.getElementById('front').setAttribute('aria-hidden', 'true')
      document.getElementById('back').removeAttribute('aria-hidden')
      markTimer = setTimeout(() => {
        marked = true
        playAnswerSound(isCorrect())
        renderStatus()
        renderBack()
        const actions = document.getElementById('actions')
        actions.innerHTML = '<button type="button" class="next">Próxima</button>'
        actions.firstElementChild.addEventListener('click', next)
      }, FLIP_MS)
    }

    function resetCard() {
      clearTimeout(markTimer)
      stopAudio()
      heard = false
      chosen = null
      marked = false
    }

    function next() {
      resetCard()
      index++
      render()
    }

    function restart() {
      resetCard()
      index = 0
      stats.correct = 0
      stats.wrong = 0
      render()
    }

    preloadSounds()
    render()
  </script>
</body>
</html>
