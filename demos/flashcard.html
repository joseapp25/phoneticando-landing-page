<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Demonstração</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    /* ── Design Tokens ───────────────────────────────────────────── */
    :root {

        --bg: var(--graycool0);
        --card-radius: 16px;
    }

    /* ── Reset & Base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background-color: var(--graycool0);
    }

    body {
      background-color: var(--graycool0);
      font-family: var(--font-dm-sans);
    }

    /* ── Progress Bar ────────────────────────────────────────────── */
    .progress-track {
      width: 304px;
      background: var(--graycool300);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cerulean600), var(--cerulean300));
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-label {
      font-size: 0.8rem;
      color: var(--graycool600);
      text-align: right;
      width: 304px;
      margin-top: 4px;
    }

    /* ── User-supplied styles (unchanged) ───────────────────────── */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .next-review-info {
      margin-top: 1rem;
      padding: 1rem;
      background-color: var(--cerulean100);
      border-radius: 8px;
      text-align: center;
    }

    .next-review-info p {
      margin-bottom: 1rem;
    }

    .action-button {
      background-color: var(--cerulean500);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .flashcard-player-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .flashcard-content {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 304px;
      height: 264px;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0px 0px 8px var(--graycool300);
      background-color: #ffffff;
      border: 1px solid var(--graycool300);
      text-align: center;
    }

    .flashcard-text-question {
      font-size: 1.5rem;
      line-height: 24px;
      color: var(--graycool900);
    }

    .flashcard-text-answer {
      font-family: var(--font-grotesk);
      font-size: 1.8rem;
      font-weight: 900;
    }

    .play-audio-button-top {
      font-family: var(--font-dm-sans);
      background-color: #ffffff;
      border: 2px solid var(--cerulean600);
      color: var(--cerulean500);
      fill: var(--cerulean500);
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .play-audio-button-top:hover {
      background-color: var(--cerulean50);
      transition: all 0.2s;
    }

    .flashcard-buttons-container p {
      color: var(--graycool600);
      font-weight: 500;
    }

    .flashcard-buttons-container div {
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .flashcard-buttons-container {
      text-align: center;
    }

    .actions-container {
      display: flex;
      margin-top: 8px;
    }

    .flashcard-button-answer,
    .flashcard-button-reset {
      background-color: var(--cerulean600);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-dm-sans);
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .flashcard-finished-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .flashcard-button-answer:hover,
    .flashcard-button-reset:hover {
      background-color: var(--cerulean800);
      box-shadow: 0px 0px 8px var(--cerulean800);
      transition: all 0.2s;
    }

    .flashcard-button-correct,
    .flashcard-button-wrong {
      background-color: #ffffff;
      border: 2px solid var(--graycool300);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .flashcard-button-correct {
      background-color: #e8f5e9;
      border-color: #4caf50;
    }

    .flashcard-button-correct:hover {
      background-color: #C8E6C9;
      transition: all 0.2s;
    }

    .flashcard-button-wrong {
      background-color: #ffebee;
      border-color: #f44336;
    }

    .flashcard-button-wrong:hover {
      background-color: #FFCDD2;
      transition: all 0.2s;
    }

    /* ── Extra polish ────────────────────────────────────────────── */
    /* Card flip animation */
    .flashcard-content {
      perspective: 800px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
    }

    .card-face.back {
      transform: rotateY(180deg);
    }

    .card-face .hint {
      font-size: 0.72rem;
      color: var(--graycool600);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Stage badge */
    .stage-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--graycool600);
      font-weight: 600;
    }

    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cerulean300);
      display: inline-block;
    }

    /* Next-review badge colours by interval */
    .interval-soon   { color: #e53935; }
    .interval-medium { color: #fb8c00; }
    .interval-long   { color: #43a047; }

    /* Finished state */
    .finished-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .finished-title {
      font-size: 1.6rem;
      color: var(--graycool800);
    }

    .finished-subtitle {
      font-size: 0.95rem;
      color: var(--graycool600);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    .score-chips {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .score-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 100px;
    }

    .chip-correct {
       background: #e8f5e9;
       color: #2e7d32;
       box-shadow: 0px 0px 4px var(--graycool400);
      }

    .chip-wrong   { 
      background: #ffebee;
      color: #c62828;
      box-shadow: 0px 0px 4px var(--graycool400);
    }

    .ipa {
      font-size: 1.1rem;
      font-family: var(--font-noto);
      color: var(--graycool700);
      font-weight: 300;
    }

    .voiceless {
      color: var(--sunset600);
      font-weight: 600;
    }

    .voiced {
      color: var(--cerulean600);
      font-weight: 600;
    }

  </style>
</head>
<body>

  <div class="flashcard-container" id="app">
    <!-- injected by JS -->
  </div>

  <script>
    // ── Data ──────────────────────────────────────────────────────
    const CARDS = [
      { 
        q: "pig<br>—<br>big",
        a: "pig<br><span class='ipa'>/<span class='voiceless'>p</span>ɪɡ/</span>",
        url: "https://www.dropbox.com/scl/fi/mwnki043b6ljz11nd3ylm/pig-elevenlabs.mp3?rlkey=k3etvqwf5j9jsefalslrpc0pv&st=pib90dig&dl=1"
      },
      { 
        q: "pig<br>—<br>big",
        a: "big<br><span class='ipa'>/<span class='voiced'>b</span>ɪɡ/</span>",
        url: "https://www.dropbox.com/scl/fi/vbvemdkaya3feraqffl7q/big-elevenlabs.mp3?rlkey=cxknh06bctfavnhqtc9kiev7a&st=kght38rf&dl=1" 
      },
      { 
        q: "ruche<br>—<br>rouge",
        a: "ruche<br><span class='ipa'>/ruː<span class='voiceless'>ʃ</span>/</span>",
        url: "https://www.dropbox.com/scl/fi/11zdq01e3aipxkmomydkr/ruche-elevenlabs.mp3?rlkey=3ydimtbdgk25xl6mjp6h2m3oo&st=axhv4hbg&dl=1" 
      },
      { 
        q: "ruche<br>—<br>rouge",
        a: "rouge<br><span class='ipa'>/ruː<span class='voiced'>ʒ</span>/</span>",
        url: "https://www.dropbox.com/scl/fi/08o7wdik3i2acbukuuhwr/rouge-elevenlabs.mp3?rlkey=gao69fk851uurigz4yvprureo&st=49vqm1to&dl=1"
      },
      { 
        q: "chin<br>—<br>gin",       
        a: "chin<br><span class='ipa'>/<span class='voiceless'>tʃ</span>ɪn/</span>",
        url: "https://www.dropbox.com/scl/fi/9bvdjhd02mwlbl9mo7cqw/chin-elevenlabs.mp3?rlkey=lrvrrfj6p981151fztwazklxx&st=cwgepywa&dl=1"
      },
      { 
        q: "chin<br>—<br>gin",
        a: "gin<br><span class='ipa'>/<span class='voiced'>dʒ</span>ɪn/</span>",
        url: "https://www.dropbox.com/scl/fi/cfu3oifnvraxxycctx5es/gin-elevenlabs.mp3?rlkey=85e7z7wb9qyzdd93a0b1gfh4d&st=681jk3js&dl=1"
      },
      { 
        q: "sue<br>—<br>zoo",
        a: "sue<br><span class='ipa'>/<span class='voiceless'>s</span>uː/</span>",
        url: "https://www.dropbox.com/scl/fi/8t481yiqfee08etdso9z8/sue-elevenlabs.mp3?rlkey=zl4ewp3m0hfjaga6c4fbrtlcl&st=q4tkjzw0&dl=1" 
      },
      { 
        q: "sue<br>—<br>zoo",
        a: "zoo<br><span class='ipa'>/<span class='voiced'>z</span>uː/</span>",
        url: "https://www.dropbox.com/scl/fi/g8unb8b55tn7lsda790re/zoo-elevenlabs.mp3?rlkey=cv6zcdrougtz843yx7vepp7w1&st=1ybuzgth&dl=1" 
      },
      { 
        q: "thigh<br>—<br>thy",       
        a: "thy<br><span class='ipa'>/<span class='voiceless'>θ</span>aɪ/</span>",
        url: "https://www.dropbox.com/scl/fi/68zlvl305aqlndo5yehbk/thy-elevenlabs.mp3?rlkey=7otrqksn7qwavcqd9yq4zdxmy&st=rgh428cw&dl=1"
      },
      { 
        q: "thigh<br>—<br>thy",
        a: "thigh<br><span class='ipa'>/<span class='voiced'>ð</span>aɪ/</span>",
        url: "https://www.dropbox.com/scl/fi/ysjxdz1g31kp8bbhq1udz/thigh-elevenlabs.mp3?rlkey=zmgdisgufs8bmizdqt8dygs3z&st=vh3kwdug&dl=1"
      },
    ];

    // Minimal SM-2-inspired intervals (days)
    const INTERVALS = { wrong: 0, correct: [1, 3, 7, 14, 30] };

    // ── State ─────────────────────────────────────────────────────
    let deck = CARDS.map((c, i) => ({ ...c, id: i, stage: 0 }));
    let queue = [...deck];
    let current = null;
    let phase = 'question'; // 'question' | 'answer'
    let stats = { correct: 0, wrong: 0 };

    // ── Helpers ───────────────────────────────────────────────────
    function nextCard() {
      if (queue.length === 0) return null;
      return queue[0];
    }

    function intervalLabel(stage) {
      if (stage === 0) return { text: '< 1 dia', cls: 'interval-soon' };
      const days = INTERVALS.correct[Math.min(stage, INTERVALS.correct.length - 1)];
      if (days <= 1)  return { text: `${days} day`,  cls: 'interval-soon'   };
      if (days <= 7)  return { text: `${days} days`, cls: 'interval-medium' };
      return            { text: `${days} days`, cls: 'interval-long'   };
    }

    // ── Render ────────────────────────────────────────────────────
    const app = document.getElementById('app');

    function render() {
      current = nextCard();

      if (!current) {
        renderFinished();
        return;
      }

      const done    = CARDS.length - queue.length;
      const pct     = Math.round((done / CARDS.length) * 100);
      const iv      = intervalLabel(current.stage);
      const stageN  = Math.min(current.stage + 1, INTERVALS.correct.length);

      app.innerHTML = `
        <!-- Progress -->
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${done} / ${CARDS.length} revisadas</div>

        <div class="flashcard-player-main">

          <!-- Audio button (decorative in demo) -->
          <button class="play-audio-button-top" onclick="playAudio('${current.url}')">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M13 2.23438L6.72302 6.00057H1V18.0006H6.72302L13 21.7668V2.23438ZM11 5.76676V18.2344L7.27698 16.0006H3V8.00057H7.27698L11 5.76676Z" />
              <path d="M18.2729 5.13724C19.9645 6.92905 21 9.34283 21 12.0006C21 14.6584 19.9645 17.0722 18.2729 18.864L19.7271 20.237C21.7552 18.0888 23 15.189 23 12.0006C23 8.81229 21.7552 5.91251 19.7271 3.76428L18.2729 5.13724Z" />
              <path d="M18.0002 12.0006C18.0002 10.3442 17.4262 8.82462 16.4654 7.62604L18.0259 6.3751C19.2609 7.91571 20.0002 9.87316 20.0002 12.0006C20.0002 14.128 19.2609 16.0854 18.0259 17.626L16.4654 16.3751C17.4262 15.1765 18.0002 13.6569 18.0002 12.0006Z" />
              <path d="M14.2009 9.60114C14.703 10.2696 15.0001 11.0989 15.0001 12.0006C15.0001 12.9022 14.703 13.7316 14.2009 14.4L15.8001 15.6011C16.5534 14.5983 17.0001 13.3501 17.0001 12.0006C17.0001 10.651 16.5534 9.40287 15.8001 8.39999L14.2009 9.60114Z" "/>
            </svg>
            Tocar Áudio
          </button>

          <!-- Card -->
          <div class="flashcard-content">
            <div class="card-inner" id="cardInner">
              <div class="card-face front">
                <span class="hint">FRENTE</span>
                <p class="flashcard-text-question">${current.q}</p>
              </div>
              <div class="card-face back">
                <span class="hint">VERSO</span>
                <p class="flashcard-text-answer">${current.a}</p>
              </div>
            </div>
          </div>

          <!-- Stage info -->
          <div class="stage-badge">
            <span class="stage-dot"></span>
            Estágio ${stageN} de ${INTERVALS.correct.length} &nbsp;·&nbsp;
            Próxima Revisão: <span class="${iv.cls}" style="margin-left:4px">${iv.text}</span>
          </div>

          <!-- Buttons -->
          <div class="flashcard-buttons-container" id="btnArea">
            ${phase === 'question'
              ? `<div class="actions-container">
                   <button class="flashcard-button-answer" onclick="showAnswer()">
                     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                     Mostrar Resposta
                   </button>
                 </div>`
              : `<p>Você acertou?</p>
                 <div class="actions-container" style="display:flex">
                   <button class="flashcard-button-wrong" onclick="grade(false)" title="Forgot">
                     <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f44336" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                   </button>
                   <div style="width:24px"></div>
                   <button class="flashcard-button-correct" onclick="grade(true)" title="Got it!">
                     <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                   </button>
                 </div>`
            }
          </div>

        </div>
      `;
    }

    function renderFinished() {
      app.innerHTML = `
        <div class="flashcard-finished-container">
          <div class="finished-icon">🎉</div>
          <p class="finished-title">Sessão Finalizada!</p>
          <p class="finished-subtitle">Você revisou todas as ${CARDS.length} cartas. Elas reaparecerão no tempo certo para serem revisadas.</p>

          <div class="score-chips">
            <div class="score-chip chip-correct">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              ${stats.correct} acertos
            </div>
            <div class="score-chip chip-wrong">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              ${stats.wrong} erros
            </div>
          </div>

          <div class="next-review-info">
            <p>Sua próxima revisão incluirá cartas que você errou e também novas cartas.</p>
            <button class="action-button" onclick="restart()">Recomeçar →</button>
          </div>
        </div>
      `;
    }

    // ── Actions ───────────────────────────────────────────────────
    function showAnswer() {
      phase = 'answer';
      document.getElementById('cardInner').classList.add('flipped');
      // swap buttons without full re-render for smooth flip
      document.getElementById('btnArea').innerHTML = `
        <p>Você acertou?</p>
        <div class="actions-container" style="display:flex">
          <button class="flashcard-button-wrong" onclick="grade(false)" title="Forgot">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f44336" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div style="width:24px"></div>
          <button class="flashcard-button-correct" onclick="grade(true)" title="Got it!">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      `;
    }

    function grade(correct) {
      queue.shift(); // remove from front
      if (correct) {
        current.stage = Math.min(current.stage + 1, INTERVALS.correct.length - 1);
        stats.correct++;
      } else {
        current.stage = 0;
        stats.wrong++;
        queue.push(current); // re-add to end
      }
      phase = 'question';
      render();
    }

    function restart() {
      deck  = CARDS.map((c, i) => ({ ...c, id: i, stage: 0 }));
      queue = [...deck];
      stats = { correct: 0, wrong: 0 };
      phase = 'question';
      render();
    }

    function playAudio(url) {
      // Decorative in demo — show a brief visual pulse
      const btn = document.querySelector('.play-audio-button-top');
      if (!btn) return;
      btn.style.background = 'var(--cerulean50)';
      const audio = new Audio(url);
      audio.addEventListener('ended', () => { btn.style.background = '#ffffff'});
      audio.play();
    }

    // ── Boot ──────────────────────────────────────────────────────
    render();
  </script>
</body>
</html>
