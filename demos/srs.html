<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaced Repetition System</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background-color: var(--graycool1000);
  }

  body {
    background-color: var(--graycool1000);
    font-family: var(--font-dm-sans);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .srs-widget {
    width: 100%;
    max-width: 600px;
  }

  /* ── Stage row ── */
  .stage-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    position: relative;
  }

  .stage-wrap {
    display: flex;
    align-items: center;
  }

  /* Box */
  .box {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform .25s ease, background .35s ease, box-shadow .35s ease, opacity .35s ease;
    cursor: default;
    background: var(--cerulean600);
  }
  .box .num {
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
    color: var(--graycool300);
  }
  .box .unit {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    margin-top: 4px;
    color: var(--graycool300);
  }

  /* Active box */
  .box.active {
    background: var(--sunset600);
    border-color: var(--sunset600);
    opacity: 1;
    transform: scale(1.1);
    box-shadow: 0 0 8px var(--sunset600), 0 0 0 1px var(--sunset600);
  }
  .box.active .num { color: var(--graycool0); }
  .box.active .unit { color: var(--graycool0); }

  /* Visited box */
  .box.visited {
    background: var(--sunset400);
    border-color: var(--sunset400);
    opacity: .75;
  }
  .box.visited .num { color: var(--graycool800); }
  .box.visited .unit { color: var(--graycool800); }

  /* Wrong-flash */
  @keyframes wrong-shake {
    0%,100%{transform:scale(1.12) translateX(0)}
    20%{transform:scale(1.12) translateX(-5px)}
    40%{transform:scale(1.12) translateX(5px)}
    60%{transform:scale(1.12) translateX(-3px)}
    80%{transform:scale(1.12) translateX(3px)}
  }
  .box.wrong {
    background: #c0392b !important;
    border-color: #c0392b !important;
    box-shadow: 0 0 32px rgba(192,57,43,.4) !important;
    animation: wrong-shake .45s ease;
  }
  .box.wrong .num { color: var(--graycool0) !important; }
  .box.wrong .unit { color: var(--graycool0) !important; }

  /* Arrow between boxes */
  .arrow {
    width: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .arrow svg {
    width: 16px;
    height: 16px;
    overflow: visible;
  }
  .arrow-line {
    stroke: #333;
    stroke-width: 1.5;
    fill: none;
    transition: stroke .4s ease;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }
  .arrow-head {
    fill: #333;
    transition: fill .4s ease;
    opacity: 0;
    transition: opacity .4s ease, fill .4s ease;
  }
  .arrow.active-arrow .arrow-line {
    stroke: var(--graycool1000);
    stroke-dashoffset: 0;
    transition: stroke .4s ease, stroke-dashoffset .35s ease;
  }
  .arrow.active-arrow .arrow-head {
    fill: var(--graycool1000);
    opacity: 1;
  }
  .arrow.visited-arrow .arrow-line {
    stroke: #4caf50;
    stroke-dashoffset: 0;
    transition: stroke .4s ease, stroke-dashoffset .35s ease;
  }
  .arrow.visited-arrow .arrow-head {
    fill: #4caf50;
    opacity: 1;
  }

  /* ── Return path ── */
  .return-path-wrap {
    position: relative;
    height: 48px;
    margin-top: 4px;
    display: flex;
    align-items: flex-end;
  }
  .return-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }
  .return-line {
    fill: none;
    stroke: #c0392b;
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .return-line.visible { opacity: 1; }
  .return-head { fill: #c0392b; opacity: 0; transition: opacity .3s ease; }
  .return-head.visible { opacity: 1; }

  /* ── Card token ── */
  .card-track {
    position: relative;
    height: 36px;
    margin-bottom: 8px;
  }
  .card-token {
    position: absolute;
    top: 0;
    left: 0;
    transform: translateX(-50%);
    background: var(--sunset300);
    border: 2px solid var(--sunset600);
    color: var(--graycool800);
    font-size: 12px;
    font-weight: 900;
    padding: 4px;
    border-radius: 8px;
    white-space: nowrap;
    transition: left .55s cubic-bezier(.4,0,.2,1);
  }
  .card-token::before {
    content: '📇 ';
  }

  /* ── Status message ── */
  .status {
    margin-bottom: 1rem;
    margin-top: 1rem;
    font-size: 13px;
    color: var(--graycool0);
    text-align: center;
    min-height: 20px;
    transition: color .3s;
    letter-spacing: .01em;
  }
  .status.ok { color: #4caf50; }
  .status.err { color: #f44336; }

  /* ── Interval badge ── */
  .interval-badge {
    text-align: center;
    margin-top: 1rem;
  }
  .interval-badge span {
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--graycool0);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="srs-widget">
  <div class="status" id="status">Revisando…</div>

  <div class="card-track" id="cardTrack">
    <div class="card-token" id="cardToken">Flashcard</div>
  </div>

  <div class="stage-row" id="stageRow"></div>

  <div class="return-path-wrap" id="returnWrap">
    <svg class="return-svg" id="returnSvg"></svg>
  </div>
  
  <div class="interval-badge">
    <span id="intervalLabel">Próxima revisão: 1 dia</span>
  </div>
</div>

<script>
const STAGES = [
  { num: '1',  unit: 'dia'   },
  { num: '4',  unit: 'dias'  },
  { num: '12',  unit: 'dias' },
  { num: '24',  unit: 'dias'  },
];

// Sequence: right 2, wrong, right 3, wrong — then repeat
const SEQUENCE = [
  {dir:'right'},
  {dir:'wrong'},
  {dir:'right'},{dir:'right'},
  {dir:'wrong'},
];

let current = 0;   // current stage index
let seqIdx  = 0;   // position in SEQUENCE
let running = true;

/* ── Build DOM ── */
const stageRow  = document.getElementById('stageRow');
const cardToken = document.getElementById('cardToken');
const statusEl  = document.getElementById('status');
const intervalEl= document.getElementById('intervalLabel');
const returnSvg = document.getElementById('returnSvg');
const returnWrap= document.getElementById('returnWrap');

// Build boxes + arrows
STAGES.forEach((s, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'stage-wrap';

  const box = document.createElement('div');
  box.className = 'box' + (i === 0 ? ' active' : '');
  box.id = 'box-' + i;
  box.innerHTML = `<span class="num">${s.num}</span><span class="unit">${s.unit}</span>`;
  wrap.appendChild(box);

  if (i < STAGES.length - 1) {
    const arr = document.createElement('div');
    arr.className = 'arrow';
    arr.id = 'arr-' + i;
    arr.innerHTML = `
      <svg viewBox="0 0 32 14" xmlns="http://www.w3.org/2000/svg">
        <line class="arrow-line" x1="0" y1="7" x2="24" y2="7"/>
        <polygon class="arrow-head" points="24,3 31,7 24,11"/>
      </svg>`;
    wrap.appendChild(arr);
  }

  stageRow.appendChild(wrap);
});

/* ── Position card token over a box ── */
function positionToken(idx, animate) {
  const box = document.getElementById('box-' + idx);
  const track = document.getElementById('cardTrack');
  const rowRect = stageRow.getBoundingClientRect();
  const boxRect = box.getBoundingClientRect();
  const trackRect = track.getBoundingClientRect();

  const center = boxRect.left + boxRect.width / 2 - trackRect.left;
  cardToken.style.transition = animate
    ? 'left .55s cubic-bezier(.4,0,.2,1)'
    : 'none';
  cardToken.style.left = center + 'px';
}

/* ── Refresh box + arrow classes ── */
function refreshUI() {
  STAGES.forEach((_, i) => {
    const box = document.getElementById('box-' + i);
    box.className = 'box' + (i < current ? ' visited' : i === current ? ' active' : '');
  });
  for (let i = 0; i < STAGES.length - 1; i++) {
    const arr = document.getElementById('arr-' + i);
    arr.className = 'arrow' +
      (i < current ? ' visited-arrow' : i === current ? ' active-arrow' : '');
  }
  const labels = ['1 dia','4 dias','12 dias','24 dias'];
  intervalEl.textContent = 'Próxima Revisão: ' + labels[current];
}

/* ── Draw / hide return arc ── */
function showReturn(fromIdx, toIdx, visible) {
  returnSvg.innerHTML = '';
  if (!visible) return;

  const rowRect = stageRow.getBoundingClientRect();
  const wrapRect = returnWrap.getBoundingClientRect();

  const fromBox = document.getElementById('box-' + fromIdx).getBoundingClientRect();
  const toBox   = document.getElementById('box-' + toIdx ).getBoundingClientRect();

  const x1 = fromBox.left + fromBox.width / 2 - wrapRect.left;
  const x2 = toBox.left   + toBox.width  / 2 - wrapRect.left;
  const y0 = 2;
  const yBot = wrapRect.height - 6;

  // Path: down from fromBox bottom → across → up to toBox bottom, arrow at end
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  const r = 10;
  path.setAttribute('d',
    `M ${x1} ${y0} L ${x1} ${yBot - r} Q ${x1} ${yBot} ${x1 - r} ${yBot}` +
    ` L ${x2 + r} ${yBot} Q ${x2} ${yBot} ${x2} ${yBot - r}` +
    ` L ${x2} ${y0 + 6}`
  );
  path.setAttribute('class','return-line visible');
  returnSvg.appendChild(path);

  // Arrowhead pointing up at x2, y0+6
  const head = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  head.setAttribute('points', `${x2-5},${y0+10} ${x2+5},${y0+10} ${x2},${y0+2}`);
  head.setAttribute('class','return-head visible');
  returnSvg.appendChild(head);
}

/* ── Status helpers ── */
function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (type || '');
}

/* ── Animation loop ── */
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function step() {
  while (running) {
    const action = SEQUENCE[seqIdx % SEQUENCE.length];
    seqIdx++;

    showReturn(0, 0, false); // clear return arc

    if (action.dir === 'right') {
      // Advance if not at end
      if (current < STAGES.length - 1) {
        current++;
      } else {
        // wrap back from mastered
        current = 0;
        seqIdx = 0;
      }
      refreshUI();
      positionToken(current, true);
      setStatus('Correta! ✓ Movendo para o próximo intervalo.', 'ok');
      await delay(2000);

    } else {
      // Wrong: flash, show arc, reset
      const fromIdx = current;
      const box = document.getElementById('box-' + fromIdx);
      box.classList.add('wrong');
      setStatus('Incorreta! ✗ — retorna ao dia 1.', 'err');
      await delay(2000);
      showReturn(fromIdx, 0, true);
      await delay(2000);

      current = 0;
      refreshUI();
      box.classList.remove('wrong');
      positionToken(0, true);
      await delay(2000);
      showReturn(0, 0, false);
      setStatus('Revisando carta…', '');
      await delay(2000);
    }
  }
}

/* ── Init ── */
refreshUI();
positionToken(0, false);
setStatus('Revisando carta…', '');

// Small delay so the layout settles before animation starts
setTimeout(step, 2000);

// Reposition token on resize
window.addEventListener('resize', () => positionToken(current, false));
</script>
</body>
</html>
